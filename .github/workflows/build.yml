name: Build and Release

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:

# 同一分支上重复触发时取消旧的一轮。与本项目的闸门哲学一致：
# 让最新的结果尽快出来，旧结果作废比排队更有意义。
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

# 工作区布局**必须**是：
#   <ws>/SpectreReplay   本仓库（checkout 的 path）
#   <ws>/adofai-libs     游戏托管程序集（私有仓）
# 理由：Directory.Build.props 优先读 ADOFAI_LIBS，否则回退到仓库同级的
# adofai-libs；本地布局与 CI 布局一致。
# 环境变量是给 tools/ 下的审计脚本和 UiPreview 用的——它们有
# 「环境变量 → 仓库同级目录 → 历史绝对路径」三级回退，CI 里走第一级。
env:
  ADOFAI_LIBS: ${{ github.workspace }}\adofai-libs

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          path: SpectreReplay
          # 不持久化 GITHUB_TOKEN 的 extraheader —— 下面克隆私有依赖仓用的是
          # URL 形式 token，extraheader 正是实测被拒的那种认证方式。
          persist-credentials: false

      # 私有依赖仓 2228293026/adofai-libs。用**显式 git clone + URL 形式 token**，
      # 不用 actions/checkout 的 `token:` 输入：后者内部走 http.extraheader，
      # 实测被 GitHub 拒成 "remote: invalid credentials"；URL 形式是唯一验过能用的。
      # 克隆失败必须让这一步红——库缺失时主项目根本编译不过，而
      # "先绿后报错"会把"依赖没拉下来"伪装成"代码有问题"。
      - name: Clone adofai-libs
        shell: bash
        env:
          LIBS_TOKEN: ${{ secrets.LIBS_ACCESS_TOKEN }}
        run: |
          if [ -z "$LIBS_TOKEN" ]; then
            echo "::error::secrets.LIBS_ACCESS_TOKEN 未配置——私有依赖仓 clone 不了"
            exit 1
          fi
          git clone --depth 1 \
            "https://x-access-token:${LIBS_TOKEN}@github.com/2228293026/adofai-libs.git" \
            adofai-libs
          # 克隆完把 token 从 remote URL 里去掉：它会以明文留在 .git/config，
          # 而后续步骤（审计脚本里会跑 git status）没必要带着它。
          git -C adofai-libs remote set-url origin \
            https://github.com/2228293026/adofai-libs.git

      # SpectreReplay.slnx 需要 SDK 10（本地 10.0.402）。
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      # 一个闸门跑完全部离线验证：主项目构建（netstandard2.1）+
      # 离线预览套件（net10.0-windows）+ 6 个只读审计。
      # -Ci 只跳过两项依赖本机安装的检查（Steam 部署一致性、上游工作区干净），
      # 其余照常全跑——这与「绿着的闸门其实有几项没跑」的忌讳一致。
      - name: Verify (offline gates)
        shell: pwsh
        working-directory: SpectreReplay
        run: ./tools/verify.ps1 -Ci

      # **构建产物必须真的存在，且这里判红。** upload-artifact 找不到文件时
      # 只发一条 warning，**步骤本身仍然成功**——第一次 CI 就是这样：build 绿、
      # artifact 空、直到 release 才发现没货。断言必须排在构建之后、上传之前。
      - name: Assert build output exists
        shell: pwsh
        run: |
          $dll  = 'SpectreReplay/SpectreReplay/bin/Release/SpectreReplay.dll'
          $info = 'SpectreReplay/SpectreReplay/bin/Release/info.json'
          foreach ($p in @($dll, $info)) {
            if (-not (Test-Path $p)) {
              Write-Error "构建产物不存在：$p（检查工作区布局与 OutputPath）"
              exit 1
            }
            Write-Host ("[artifact] ✓ {0}  ({1} B)" -f $p, (Get-Item $p).Length)
          }

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: SpectreReplay
          # **两层 SpectreReplay。** 本仓库被 checkout 到 <ws>/SpectreReplay
          # （见文件头的工作区布局），工程目录本身也叫 SpectreReplay，
          # 所以产物在 SpectreReplay/SpectreReplay/bin/Release/。
          # 少写一层时 upload-artifact 只发一条 annotation、**步骤仍然成功**
          # （第一次 CI 就是这样：build 绿了，artifact 为空，release 才发现没货）。
          path: |
            SpectreReplay/SpectreReplay/bin/Release/SpectreReplay.dll
            SpectreReplay/SpectreReplay/bin/Release/info.json

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: SpectreReplay
          path: ./build

      - name: List artifact structure
        shell: pwsh
        run: Get-ChildItem -Recurse -File build | ForEach-Object { $_.FullName }

      # 防 tag 与元数据漂移：info.json 才是 UMM 认的版本号。
      # 两者不一致时发布出去的是一个"版本号说谎"的包，安装端更新检查会失灵，
      # 而这在构建日志里看不出来。
      #
      # **预发布 tag 只核对基础版本。** v0.1.0-rc1 对应 info.json 的 0.1.0：
      # UMM 用 System.Version 解析 info.json 的 Version，"0.1.0-rc1" 会直接
      # 解析失败、模组根本加载不起来——所以预发布信息只能留在 tag 上，
      # 不能写进 info.json。要求它与 tag 逐字相等等于禁止预发布。
      - name: Verify tag matches info.json
        shell: pwsh
        run: |
          $info = Get-ChildItem -Recurse -File build -Filter info.json | Select-Object -First 1
          if (-not $info) { Write-Error "构建产物里没有 info.json"; exit 1 }
          $version = (Get-Content $info.FullName -Raw | ConvertFrom-Json).Version
          $tag = '${{ github.ref_name }}'.TrimStart('v')
          # 去掉 -rc1 / -beta2 之类的预发布后缀再比
          $base = ($tag -split '-')[0]
          if ($version -ne $base) {
            Write-Error "info.json Version ($version) 与 tag (${{ github.ref_name }}) 的基础版本 ($base) 不一致"
            exit 1
          }
          if ($version -ne $tag) {
            Write-Host "[release] ✓ info.json Version = $version；tag ${{ github.ref_name }} 是预发布（基础版本一致）"
          } else {
            Write-Host "[release] ✓ info.json Version = $version"
          }

      # 版本一致性：info.json / repo.json / AssemblyInfo / CHANGELOG 必须同一个基础版本。
      # 只校验 info.json 时，release 页会出现「dll 显示 0.3.2、repo 说 0.3.1」这种
      # UMM 更新检查直接失效的错配。
      - name: Check version consistency
        shell: pwsh
        run: |
          $tag  = '${{ github.ref_name }}'
          $base = (($tag -replace '^v', '') -split '-')[0]
          $info = Get-Content -Raw SpectreReplay/SpectreReplay/bin/Release/info.json | ConvertFrom-Json
          $repo = Get-Content -Raw repo.json | ConvertFrom-Json
          $asm  = (Select-String -Path SpectreReplay/SpectreReplay/AssemblyInfo.cs -Pattern 'AssemblyInformationalVersion\("([^"]+)"\)').Matches[0].Groups[1].Value
          $chg  = (Select-String -Path CHANGELOG.md -Pattern '^## \[([^\]]+)\]').Matches[0].Groups[1].Value
          $bad = @()
          if ($info.version -ne $base) { $bad += "info.json=$($info.version)" }
          if ($repo.Releases[0].Version -ne $base) { $bad += "repo.json=$($repo.Releases[0].Version)" }
          if ($asm -ne $base) { $bad += "AssemblyInfo=$asm" }
          if ($chg -ne $base) { $bad += "CHANGELOG=$chg" }
          if ($bad.Count -gt 0) {
            Write-Error "版本不一致（tag 基础版本 $base）：$($bad -join '; ')"
            exit 1
          }
          Write-Host "[release] ✓ 版本一致：$base"

      # mod 包：dll + info.json 平铺在 zip 根。loader 靠 info.json 发现模组，
      # 缺了它 DLL 根本不会被加载（README 的安装步骤同此口径）。
      - name: Package mod zip
        shell: pwsh
        run: |
          $dll  = Get-ChildItem -Recurse -File build -Filter SpectreReplay.dll | Select-Object -First 1
          $info = Get-ChildItem -Recurse -File build -Filter info.json          | Select-Object -First 1
          if (-not $dll)  { Write-Error "构建产物里没有 SpectreReplay.dll"; exit 1 }
          if (-not $info) { Write-Error "构建产物里没有 info.json"; exit 1 }
          New-Item -ItemType Directory -Force stage | Out-Null
          Copy-Item $dll.FullName  stage/
          Copy-Item $info.FullName stage/
          Compress-Archive -Path stage/* -DestinationPath "SpectreReplay-${{ github.ref_name }}.zip"

      # 视频渲染需要 ffmpeg。钉死 BtbN 的 autobuild 与 SHA256：
      # latest 端点不可复现，且供应链上「今天能下、明天被换」是最难查的一类。
      # 升级时改 URL + 校验和，并跑一次本地渲染冒烟。
      - name: Download ffmpeg
        shell: pwsh
        run: |
          $url = 'https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-11-13-12-43/ffmpeg-N-128889-g88c46fce27-win64-gpl.zip'
          $expected = '35FA1C17EEEAD1F572072B134458788CAF71C4A7FBCE9E0BB2F3C41032959531'
          curl.exe -L --fail --retry 10 --retry-delay 5 --retry-all-errors -o ffmpeg.zip $url
          $actual = (Get-FileHash ffmpeg.zip -Algorithm SHA256).Hash
          if ($actual -ne $expected) {
            Write-Error "ffmpeg.zip SHA256 不匹配：expected=$expected actual=$actual"
            exit 1
          }
          Expand-Archive -Path ffmpeg.zip -DestinationPath ffmpeg_extract
          Get-ChildItem -Path ffmpeg_extract -Recurse -Filter ffmpeg.exe |
            Select-Object -First 1 | Move-Item -Destination .

      # 能力断言只针对发布包里的 ffmpeg；玩家自备的旧 ffmpeg 由运行时
      # EncoderCatalog 处理，两者不能互相替代。失败时把 -encoders 清单存 artifact。
      - name: Check ffmpeg capabilities
        shell: pwsh
        run: |
          & tools/ffmpeg-capability.ps1 -Ffmpeg .\ffmpeg.exe -OutFile ffmpeg-encoders.txt

      - name: Upload ffmpeg capability report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ffmpeg-capability
          path: ffmpeg-encoders.txt

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            SpectreReplay-${{ github.ref_name }}.zip
            ffmpeg.exe
          # tag 里带 '-'（v0.1.0-rc1）即为预发布。**必须显式写**：
          # 不写时 softprops 默认建成正式版，预发布 tag 会直接出现在
          # 所有用户的"最新版本"里——而它按定义还不是发布候选。
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          body: |
            安装 / Install：
            1. 安装 [UnityModManager](https://www.nexusmods.com/site/mods/21)
            2. 解压 `SpectreReplay-${{ github.ref_name }}.zip`，把 `SpectreReplay.dll` 与 `info.json`
               放入 `UnityModManager/ADOfAI/Mods/SpectreReplay/`
               （`info.json` 是 loader 发现模组的唯一依据，缺了它 DLL 不会被加载）
            3. 视频渲染需要 ffmpeg：下载本页 `ffmpeg.exe`（Windows x64），
               放入 mod 目录、游戏根目录或 PATH 任一位置
